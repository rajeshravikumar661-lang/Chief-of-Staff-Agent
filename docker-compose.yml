# Local full-stack run: db + redis + web + worker.
# Prereqs: a .env file (see .env.example) with GOOGLE_CLIENT_* and ANTHROPIC_API_KEY.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cos_agent
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  web:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cos_agent?schema=public
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: http://localhost:3000
    env_file: [.env]
    ports: ["3000:3000"]

  worker:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cos_agent?schema=public
      REDIS_URL: redis://redis:6379
    env_file: [.env]
    command: ["node", "--import", "tsx", "src/jobs/worker.ts"]

volumes:
  pgdata:
